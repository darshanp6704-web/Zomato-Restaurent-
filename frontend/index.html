<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GASTRO AI | Zomato AI Concierge</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

          extend: {

              "inverse-primary": "#9d4300",

              "surface-container-lowest": "#060e20",
              "primary-fixed-dim": "#ffb690",
              "surface-container-high": "#222a3d",
              "primary-fixed": "#ffdbca",
              "background": "#0b1326",
              "error": "#ffb4ab",
              "surface": "#0b1326",
              "tertiary-container": "#8c8fff",
              "inverse-on-surface": "#283044",
              "outline-variant": "#584237",
              "surface-variant": "#2d3449",
              "on-background": "#dae2fd",
              "on-primary-container": "#582200",
              "on-secondary-container": "#ffaea8",
              "on-tertiary-container": "#1304ac",
              "primary-container": "#f97316",
              "surface-container-highest": "#2d3449",
              "error-container": "#93000a",
              "surface-dim": "#0b1326",
              "on-error": "#690005",
              "on-primary": "#552100",
              "secondary-fixed-dim": "#ffb3ad",
              "surface-container": "#171f33",
              "tertiary": "#c0c1ff",
              "secondary": "#ffb3ad",
              "surface-tint": "#ffb690",
              "on-tertiary-fixed-variant": "#2f2ebe",
              "on-secondary-fixed": "#410004",
              "surface-bright": "#31394d",
              "surface-container-low": "#131b2e",
              "on-tertiary-fixed": "#07006c",
              "secondary-container": "#a40217",
              "primary": "#ffb690",
              "on-primary-fixed": "#341100",
              "on-secondary-fixed-variant": "#930013",
              "on-secondary": "#68000a",
              "on-surface-variant": "#e0c0b1",
              "on-primary-fixed-variant": "#783200"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "stack-sm": "8px",
              "stack-md": "16px",
              "gutter": "16px",
              "container-padding-desktop": "32px",
              "container-padding-mobile": "16px",
              "unit": "4px",
              "stack-lg": "32px"
            },
            "fontFamily": {
              "headline-lg-mobile": ["Outfit"],
              "label-sm": ["Outfit"],
              "headline-md": ["Outfit"],
              "headline-lg": ["Outfit"],
              "display": ["Outfit"],
              "body-lg": ["Outfit"],
              "body-md": ["Outfit"],
              "label-md": ["Outfit"]

            "fontSize": {
              "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
              "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

              "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]

        },
      }

    <style>
      body {
        background: linear-gradient(135deg, #0b1326 0%, #171f33 100%);
        color: #dae2fd;
        min-height: 100vh;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      .shimmer {
        background: linear-gradient(90deg, #1E293B 25%, #2d3449 50%, #1E293B 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .glow-orange {
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #f97316 !important;
        box-shadow: 0 0 10px rgba(249, 115, 22, 0.2) !important;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="font-body-md text-body-md overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
